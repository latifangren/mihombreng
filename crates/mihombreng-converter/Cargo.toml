[package]
name = "mihombreng-converter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
url = "2.5"
percent-encoding = "2.3"
ipnet = { version = "2.9", features = ["serde"] }
